<style>
*{font-family:Inter,sans-serif}.mono{font-family:monospace}
/* ===== STRUK A5 LANDSCAPE ===== */
.sk{width:210mm;min-height:148mm;box-sizing:border-box;padding:9mm 10mm;background:#fff;color:#000;font-size:11px;line-height:1.35;margin:0 auto;box-shadow:0 1px 8px rgba(0,0,0,.18)}
.sk,.sk *{font-family:Arial,Helvetica,sans-serif}
.sk-head{display:flex;align-items:center;gap:12px;border-bottom:2px solid #000;padding-bottom:6px}
.sk-head img{width:62px;height:auto;flex:none}
.sk-org{flex:1}.sk-org .n1{font-size:15px;font-weight:700;letter-spacing:.3px}.sk-org .n2{font-size:10.5px}
.sk-title{text-align:right}.sk-title .t{font-size:14px;font-weight:700}.sk-title .no{font-size:10.5px;font-family:monospace}
.sk-info{display:grid;grid-template-columns:1fr 1fr;gap:2px 24px;margin:8px 0}
.sk-info div{display:flex}.sk-info b{width:72px;font-weight:600;flex:none}
.sk table{width:100%;border-collapse:collapse}
.sk th,.sk td{border:1px solid #000;padding:3px 5px;vertical-align:top}
.sk th{background:#e5e5e5;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sk thead{display:table-header-group}.sk tr{page-break-inside:avoid;break-inside:avoid}
.sk .c{text-align:center}.sk .r{text-align:right}.sk .mn{font-family:monospace;font-size:10px}
.sk tr.tot td{font-weight:700;background:#f3f3f3;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sk-sign{display:flex;justify-content:space-around;margin-top:14px;break-inside:avoid;page-break-inside:avoid}
.sk-sign>div{text-align:center;width:40%}.sk-sign .line{height:46px}
.sk-foot{font-size:9px;color:#555;margin-top:8px;text-align:center}
.sk-cont{text-align:right;font-size:10px;margin-top:4px}
@page{size:A5 landscape;margin:8mm}
@media print{
  html,body{background:#fff !important}
  body>*:not(#strukPrint){display:none !important}
  #strukPrint{display:block !important}
  #strukPrint .sk{width:auto;min-height:0;padding:0;box-shadow:none;margin:0}
  #strukPrint .sk-page{page-break-after:always;break-after:page;margin-bottom:0}
  #strukPrint .sk-page:last-child{page-break-after:auto;break-after:auto}
}
</style>

async function sha256(str){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}

function renderCharts(){
  const divisiAgg={};
  state.keluarTransactions.forEach(t=>{
    const d=t.divisi||'Tanpa Divisi';
    if(!divisiAgg[d]) divisiAgg[d]={count:0,item:0,nilai:0};
    divisiAgg[d].count++; divisiAgg[d].item+=t.totalItem||0; divisiAgg[d].nilai+=t.totalNilai||0;
  });
  const labels=Object.keys(divisiAgg);
  const qtyData=Object.values(divisiAgg).map(v=>v.item);
  const nilaiData=Object.values(divisiAgg).map(v=>v.nilai);

  Object.values(state.charts).forEach(c=>{try{c.destroy();}catch(e){}});
  state.charts={};

  const ctx1=document.getElementById('chartDivisiQty');
  if(ctx1){
    state.charts.qty=new Chart(ctx1,{
      type:'bar',
      data:{labels:labels,datasets:[{label:'Qty Keluar',data:qtyData,backgroundColor:'#4f46e5'}]},
      options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}
    });
  }
  const ctx2=document.getElementById('chartDivisiNilai');
  if(ctx2){
    const colors=['#4f46e5','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#14b8a6'];
    state.charts.nilai=new Chart(ctx2,{
      type:'doughnut',
      data:{labels:labels,datasets:[{data:nilaiData,backgroundColor:colors.slice(0,labels.length)}]},
      options:{responsive:true,plugins:{legend:{position:'bottom'}}}
    });
  }
  const dailyAgg={};
  state.keluarTransactions.forEach(t=>{
    const day=localDay(t.tanggal);
    if(!dailyAgg[day]) dailyAgg[day]=0;
    dailyAgg[day]+=t.totalItem||0;
  });
  const dailyLabels=Object.keys(dailyAgg).sort().slice(-14);
  const dailyQty=dailyLabels.map(d=>dailyAgg[d]);
  const ctx3=document.getElementById('chartTrend');
  if(ctx3){
    state.charts.trend=new Chart(ctx3,{
      type:'line',
      data:{labels:dailyLabels,datasets:[{label:'Item Keluar Harian',data:dailyQty,borderColor:'#4f46e5',backgroundColor:'rgba(79,70,229,0.1)',fill:true,tension:0.4}]},
      options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}
    });
  }
}

    const d=t.divisi||'Tanpa Divisi';
    const bulan=localDay(t.tanggal).slice(0,7);
    bulanSet.add(bulan);
    if(!pivot[d]) pivot[d]={};
    if(!pivot[d][bulan]) pivot[d][bulan]=0;

  });
  const bulans=Array.from(bulanSet).sort().slice(-2);
  const hd=document.getElementById('pivotBulanHead');
  if(hd){
    const nm=b=>BULAN_NAMA[+b.slice(5,7)-1].slice(0,3)+' '+b.slice(0,4);

  }
  const tbody=document.getElementById('pivotBulanBody');
  if(!tbody) return;
  let html='';
  Object.entries(pivot).sort((a,b)=>{const totalA=Object.values(a[1]).reduce((s,v)=>s+v,0); const totalB=Object.values(b[1]).reduce((s,v)=>s+v,0); return totalB-totalA;}).forEach(([divisi, perBulan])=>{

    html+=`<td class="p-2 text-right font-bold">${total}</td></tr>`;
  });
  if(html==='') html=`<tr><td colspan="${bulans.length+2}" class="p-4 text-center text-zinc-400">Belum ada data - sync dulu</td></tr>`;

}

function getRK(){if(!state.rk)state.rk={q:'',divisi:'Semua',dari:'',sampai:''};return state.rk;}
function riwayatKeluarRows(){
  const f=getRK();const q=f.q.trim().toLowerCase();const rows=[];
  state.keluarTransactions.forEach(t=>{
    if(f.divisi!=='Semua'&&t.divisi!==f.divisi)return;
    const day=localDay(t.tanggal);
    if(f.dari&&day<f.dari)return;
    if(f.sampai&&day>f.sampai)return;
    (t.items||[]).forEach(i=>{
      if(q){
        const hay=[i.Nama_Barang,i.Barcode,t.no_struk,t.pengambil,t.petugas,t.divisi].map(x=>String(x||'').toLowerCase()).join(' ');
        if(!hay.includes(q))return;
      }
      rows.push({t,i,jumlah:Number(i.jumlah||0),harga:Number(i.Harga_Satuan||0)});
    });
  });
  rows.sort((a,b)=>String(b.t.tanggal).localeCompare(String(a.t.tanggal))||String(b.t.no_struk).localeCompare(String(a.t.no_struk)));
  return rows;
}

  if(rows.length===0)h+=`<tr><td colspan="10" class="p-8 text-center text-zinc-400">Tidak ada riwayat yang cocok</td></tr>`;

async function syncFromSupabase(){
  if(!state.supabaseClient){toast('Connect Supabase dulu','error');return;}
  if(!navigator.onLine){toast('Sedang offline - memakai data lokal','info');return;}
  if(!(await flushQueue())){toast('Masih ada data belum terkirim ke Supabase, sync ditunda agar data tidak hilang','error');return;}
  state.loadingSync=true; render(); toast('Tarik data dari Supabase...','info');
  try{
    const {data: masterData, error: errM} = await state.supabaseClient.from('master_barang').select('*').limit(1000);
    if(errM) throw new Error('Gagal tarik master_barang: '+errM.message);
    if(masterData && masterData.length>0){
      state.master = masterData.map(r=>({Barcode:r.barcode,Nama_Barang:r.nama_barang,Kategori:r.kategori,Satuan:r.satuan,Harga_Satuan:r.harga_satuan,Stok_Minimum:r.stok_minimum,Stok_Saat_Ini:r.stok_saat_ini,Total_Masuk:r.total_masuk,Total_Keluar:r.total_keluar,Penyesuaian:r.penyesuaian}));
    }
    const keluarData = await fetchAllRows('barang_keluar',[['tanggal',false],['no_struk',true],['barcode',true]]);
    if(keluarData.length>0){
      const grouped={};
      keluarData.forEach(row=>{
        if(!grouped[row.no_struk]) grouped[row.no_struk]={no_struk:row.no_struk,tanggal:row.tanggal,divisi:row.divisi,pengambil:row.pengambil,petugas:row.petugas,items:[],totalItem:0,totalNilai:0};
        grouped[row.no_struk].items.push({Barcode:row.barcode,Nama_Barang:row.nama_barang,jumlah:row.jumlah,Harga_Satuan:row.harga_satuan});
        grouped[row.no_struk].totalItem+=row.jumlah;
        grouped[row.no_struk].totalNilai+= (row.jumlah* (row.harga_satuan||0));
      });
      state.keluarTransactions = Object.values(grouped);
    }
    const masukData = await fetchAllRows('barang_masuk',[['tanggal',false],['id_transaksi',true]]);
    if(masukData.length>0){
      const groupedM={};
      masukData.forEach(row=>{
        // id_transaksi = <no_struk>-<barcode>; barcode boleh mengandung "-", jadi ambil no_struk dengan pola IN-YYYYMMDD-XXXX
        const mm=String(row.id_transaksi||'').match(/^(IN-\d{8}-[A-Z0-9]{4})/);
        const no_struk = mm ? mm[1] : String(row.id_transaksi||'');
        if(!groupedM[no_struk]) groupedM[no_struk]={no_struk:no_struk,tanggal:row.tanggal,petugas:row.petugas,items:[],totalQty:0};
        groupedM[no_struk].items.push({Barcode:row.barcode,Nama_Barang:row.nama_barang,jumlah:row.jumlah});
        groupedM[no_struk].totalQty+=row.jumlah;
      });
      state.masukTransactions = Object.values(groupedM);
    }
    save(); state.loadingSync=false;
    toast(`Sync selesai! Keluar: ${state.keluarTransactions.length} trx`,'success');
    render();
  }catch(e){state.loadingSync=false;toast('Sync gagal: '+e.message,'error');render();}
}

function handleBarcodeMasukEnter(){const input=document.getElementById('barcodeMasukInput');const code=input.value.trim();if(!code)return;processBarcodeMasuk(code);input.value='';}
function processBarcodeMasuk(barcode){let item=state.master.find(m=>String(m.Barcode)===String(barcode));if(!item){const base=String(barcode).split('-FIX')[0];item=state.master.find(m=>String(m.Barcode)===base);}const foundDiv=document.getElementById('barangDitemukanMasuk');const newDiv=document.getElementById('barangBaruMasuk');if(item){foundDiv.classList.remove('hidden');newDiv.classList.add('hidden');document.getElementById('foundInfoMasuk').innerHTML=`<div><div class="font-bold">${escHtml(item.Nama_Barang)}</div><div class="text-xs mono">${escHtml(item.Barcode)} • Stok ${item.Stok_Saat_Ini}</div></div>`;foundDiv.dataset.barcode=item.Barcode;}else{foundDiv.classList.add('hidden');newDiv.classList.remove('hidden');document.getElementById('newBarcodeDisplay').textContent=barcode;newDiv.dataset.barcode=barcode;}}

function addToCartMasuk(){const div=document.getElementById('barangDitemukanMasuk');const barcode=div.dataset.barcode;const item=state.master.find(m=>String(m.Barcode)===String(barcode));if(!item){toast('Barang tidak ditemukan','error');return;}const jumlah=parseInt(document.getElementById('jumlahMasuk').value)||1;const existing=state.cartMasuk.find(c=>c.Barcode===barcode);if(existing){existing.jumlah+=jumlah;}else{state.cartMasuk.push({...item, jumlah});}toast(item.Nama_Barang+' ditambah','success');div.classList.add('hidden');render();}
async function simpanBarangBaruDanMasuk(){const div=document.getElementById('barangBaruMasuk');const barcode=div.dataset.barcode;const nama=document.getElementById('newNama').value.trim();const kategori=document.getElementById('newKategori').value;const satuan=document.getElementById('newSatuan').value;const harga=parseInt(document.getElementById('newHarga').value)||0;const jumlah=parseInt(document.getElementById('newJumlah').value)||1;if(!nama){toast('Nama wajib','error');return;}if(state.master.some(m=>String(m.Barcode)===String(barcode))){toast('Barcode sudah terdaftar','error');return;}const newItem={Barcode:barcode,Nama_Barang:nama,Kategori:kategori,Satuan:satuan,Harga_Satuan:harga,Stok_Minimum:10,Stok_Saat_Ini:0,Total_Masuk:0,Total_Keluar:0,Penyesuaian:0};state.master.push(newItem);state.cartMasuk.push({...newItem, jumlah, isNew:true});save();div.classList.add('hidden');render();
  if(state.supabaseClient){
    const ok=await sendOrQueue({table:'master_barang',op:'upsert',rows:[{barcode:newItem.Barcode,nama_barang:newItem.Nama_Barang,kategori:newItem.Kategori,satuan:newItem.Satuan,harga_satuan:newItem.Harga_Satuan,stok_minimum:newItem.Stok_Minimum,stok_saat_ini:0,total_masuk:0,total_keluar:0,penyesuaian:0}],conflict:'barcode'});

    else toast('Barang baru '+nama+' tersimpan lokal, akan dikirim saat online','info');
  }else toast('Barang baru '+nama+' ditambahkan (mode lokal)','success');

function strukHTML(t,type){
  const masuk=type==='masuk';
  const items=t.items||[];
  const totalQty=items.reduce((s,i)=>s+(Number(i.jumlah)||0),0);
  const totalNilai=items.reduce((s,i)=>s+(Number(i.jumlah)||0)*(Number(i.Harga_Satuan)||0),0);
  const satuanOf=i=>i.Satuan||(state.master.find(m=>String(m.Barcode)===String(i.Barcode))||{}).Satuan||'Pcs';
  
  // A5 Landscape aman untuk 18 baris. Turunkan ke 15 jika masih terpotong.
  const MAX_ROWS_PER_PAGE = 18;
  
  const chunks = [];
  for(let i = 0; i < items.length; i += MAX_ROWS_PER_PAGE){
    chunks.push(items.slice(i, i + MAX_ROWS_PER_PAGE));
  }
  if(chunks.length === 0) chunks.push([]);
  
  const totalPages = chunks.length;
  
  const info = masuk
    ? `<div><b>Tanggal</b>: ${escHtml(fmtTgl(t.tanggal))}</div><div><b>Petugas</b>: ${escHtml(t.petugas||'-')}</div>`
    : `<div><b>Tanggal</b>: ${escHtml(fmtTgl(t.tanggal))}</div><div><b>Divisi</b>: ${escHtml(t.divisi||'-')}</div><div><b>Pengambil</b>: ${escHtml(t.pengambil||'-')}</div><div><b>Petugas</b>: ${escHtml(t.petugas||'-')}</div>`;
  
  const pages = chunks.map((chunk, pageIdx) => {
    const isLastPage = pageIdx === totalPages - 1;
    const isFirstPage = pageIdx === 0;
    const startNo = pageIdx * MAX_ROWS_PER_PAGE;
    
    const rows = chunk.map((i, n) => {
      const noUrut = startNo + n + 1;
      return `<tr>
        <td class="c">${noUrut}</td>
        <td class="mn">${escHtml(i.Barcode)}</td>
        <td>${escHtml(i.Nama_Barang)}</td>
        <td class="c">${escHtml(i.jumlah)}</td>
        <td class="c">${escHtml(satuanOf(i))}</td>
        ${masuk?'':`<td class="r">${formatRp(i.Harga_Satuan)}</td><td class="r">${formatRp((Number(i.jumlah)||0)*(Number(i.Harga_Satuan)||0))}</td>`}

    }).join('');
    
    const foot = isLastPage
      ? (masuk
        ? `<tr class="tot"><td colspan="3" class="r">Total Barang Masuk</td><td class="c">${totalQty}</td><td></td></tr>`
        : `<tr class="tot"><td colspan="3" class="r">Total</td><td class="c">${totalQty}</td><td></td><td class="r">Total Nilai</td><td class="r">${formatRp(t.totalNilai||totalNilai)}</td></tr>`)
      : '';
    
    const sign = isLastPage
      ? `<div class="sk-sign">
          <div>${masuk?'':'Pengambil'}<div class="line"></div>${masuk?'':'( '+escHtml(t.pengambil||'..............')+' )'}</div>
          <div>Petugas Gudang<div class="line"></div>( ${escHtml(t.petugas||'..............')} )</div>
        </div>`
      : '';
    
    const cont = !isLastPage
      ? `<div class="sk-cont">↳ Bersambung ke halaman ${pageIdx + 2} dari ${totalPages}...</div>`
      : '';
    
    const head = isFirstPage
      ? `<div class="sk-head">
          <img src="${LOGO_FILE}" alt="Logo"/>
          <div class="sk-org"><div class="n1">PONDOK PESANTREN DARUL ARQAM</div><div class="n2">Gudang PPDA</div></div>
          <div class="sk-title">
            <div class="t">${masuk?'BUKTI BARANG MASUK':'BUKTI BARANG KELUAR'}</div>
            <div class="no">No: ${escHtml(t.no_struk)}</div>
            <div class="no" style="font-size:9px">Hal. ${pageIdx+1}/${totalPages}</div>
          </div>
        </div>
        <div class="sk-info">${info}</div>`
      : `<div class="sk-head">
          <img src="${LOGO_FILE}" alt="Logo"/>
          <div class="sk-org"><div class="n1">PONDOK PESANTREN DARUL ARQAM</div><div class="n2">Gudang PPDA</div></div>
          <div class="sk-title">
            <div class="t">${masuk?'BUKTI BARANG MASUK':'BUKTI BARANG KELUAR'} (LANJUTAN)</div>
            <div class="no">No: ${escHtml(t.no_struk)}</div>
            <div class="no" style="font-size:9px">Hal. ${pageIdx+1}/${totalPages}</div>
          </div>
        </div>
        <div class="sk-info" style="font-size:10px;color:#555">
          <div><b>Lanjutan dari</b>: Halaman ${pageIdx}</div>
          <div><b>Tanggal</b>: ${escHtml(fmtTgl(t.tanggal))}</div>
        </div>`;
    
    return `<div class="sk sk-page">
      ${head}
      <table>
        <thead>
          <tr>
            <th style="width:28px">No</th>
            <th style="width:105px">Barcode</th>
            <th>Nama Barang</th>
            <th style="width:44px">Qty</th>
            <th style="width:52px">Satuan</th>
            ${masuk?'':'<th style="width:82px">Harga</th><th style="width:92px">Subtotal</th>'}
          </tr>
        </thead>
        <tbody>${rows}</tbody>
        <tfoot>${foot}</tfoot>
      </table>
      ${cont}
      ${sign}
      <div class="sk-foot">Dokumen ini dicetak otomatis dari sistem GoedangDA - Darul Arqam</div>
    </div>`;
  }).join('');
  
  return pages;
}

async function fetchAllRows(table,orderCols){
  let all=[];
  for(let from=0;from<20000;from+=1000){
    let q=state.supabaseClient.from(table).select('*');
    orderCols.forEach(([c,asc])=>{q=q.order(c,{ascending:asc});});
    const {data,error}=await q.range(from,from+999);
    if(error)throw new Error('Gagal tarik '+table+': '+error.message);   // jangan diam-diam menelan error
    if(!data)break;
    all=all.concat(data);
    if(data.length<1000)break;
  }
  return all;
}

function tglYM(t){if(typeof t==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(t))return{y:+t.slice(0,4),m:+t.slice(5,7)};const d=new Date(t);return{y:d.getFullYear(),m:d.getMonth()+1};}
function lapXlDate(t){
  if(typeof t==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(t))return new Date(Date.UTC(+t.slice(0,4),+t.slice(5,7)-1,+t.slice(8,10)));
  const d=new Date(t);if(isNaN(d))return String(t||'');
  return new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours(),d.getMinutes()));
}
function lapKey(nama){
  const n=String(nama||'').trim().toLowerCase();
  for(const k of Object.keys(LAP_DIV)){if(LAP_DIV[k].alias.includes(n))return k;}

}
function getKeluarRows(){
  const rows=[];
  state.keluarTransactions.forEach(t=>{(t.items||[]).forEach(it=>{rows.push({no_struk:t.no_struk,tanggal:t.tanggal,divisi:String(t.divisi||'Tanpa Divisi').trim(),pengambil:t.pengambil||'',barcode:String(it.Barcode),nama_barang:it.Nama_Barang,jumlah:Number(it.jumlah)||0});});});
  return rows;
}
/* Rekap: SELURUH master barang ditampilkan.
   Stok Akhir = stok master sekarang, dikoreksi transaksi SETELAH periode laporan
   (keluar susulan ditambah, masuk susulan dikurangi) -> untuk bulan terakhir = stok master.
   Stok Awal  = Stok Akhir + Jml keluar bulan itu  (jadi Stok Awal - Jml = Stok Akhir). */
function buildLaporanData(bulan,tahun){
  const idx=tahun*12+bulan;
  const semuaKeluar=getKeluarRows();
  const rows=semuaKeluar.filter(r=>{const p=tglYM(r.tanggal);return p.y===tahun&&p.m===bulan;});
  rows.forEach(r=>{r.dk=lapKey(r.divisi)||('X:'+r.divisi);});
  const act=new Set(rows.map(r=>r.dk));
  const extras=[...act].filter(k=>k.startsWith('X:'));
  const cols=[...LAP_ORDER_REKAP.filter(k=>act.has(k)).map(k=>({key:k,title:LAP_DIV[k].full})),...extras.map(k=>({key:k,title:k.slice(2)}))];
  const rekapRows=[];const byBc={};
  const nrm=x=>String(x==null?'':x).trim().toLowerCase();
  const addRow=(bc,nama,satuan,stok)=>{const e={barcode:bc,nama:nama,satuan:satuan,stok_awal:stok,divisi_qty:{},jml:0,stok_akhir:stok};rekapRows.push(e);(byBc[bc]||(byBc[bc]=[])).push(e);return e;};
  state.master.forEach(m=>addRow(String(m.Barcode),m.Nama_Barang,m.Satuan,Number(m.Stok_Saat_Ini)||0));
  const lookup=(bc,nama)=>{const l=byBc[String(bc)];if(!l)return null;return l.length===1?l[0]:(l.find(e=>nrm(e.nama)===nrm(nama))||l[0]);};
  // keluar pada bulan laporan
  rows.forEach(r=>{const e=lookup(r.barcode,r.nama_barang)||addRow(String(r.barcode),r.nama_barang,'Pcs',0);e.divisi_qty[r.dk]=(e.divisi_qty[r.dk]||0)+r.jumlah;e.jml+=r.jumlah;});
  // koreksi transaksi setelah periode laporan
  const after=t=>{const p=tglYM(t);return p.y*12+p.m>idx;};
  semuaKeluar.forEach(r=>{if(after(r.tanggal)){const e=lookup(r.barcode,r.nama_barang);if(e)e.stok_akhir+=r.jumlah;}});
  state.masukTransactions.forEach(t=>{if(!after(t.tanggal))return;(t.items||[]).forEach(i=>{const e=lookup(i.Barcode,i.Nama_Barang);if(e)e.stok_akhir-=Number(i.jumlah)||0;});});
  rekapRows.forEach(e=>{e.stok_awal=e.stok_akhir+e.jml;});
  return{rows,cols,rekapRows};
}

function renderLaporanPreview(){

  const info=document.getElementById('lapInfo');
  const keluarN=rekapRows.filter(r=>r.jml>0).length;
  if(info)info.textContent=`Periode ${BULAN_NAMA[state.lapBulan-1]} ${state.lapTahun}: ${rekapRows.length} barang (master) • ${keluarN} barang keluar • ${rows.length} baris keluar • ${new Set(rows.map(r=>r.no_struk)).size} struk • ${cols.length} divisi`;
  if(!rekapRows.length){box.innerHTML='<div class="p-6 text-sm text-zinc-500 text-center">Master Barang kosong. Klik Sync data.</div>';return;}
  let h=`<table class="w-full text-[11px]"><thead class="bg-zinc-900 text-white sticky top-0"><tr><th class="p-2 text-left">Barcode</th><th class="p-2 text-left">Nama</th><th class="p-2">Stok Awal</th>${cols.map(c=>`<th class="p-2">${escHtml(c.title)}</th>`).join('')}<th class="p-2">Jml</th><th class="p-2">Stok Akhir</th></tr></thead><tbody>`;
  rekapRows.forEach(r=>{h+=`<tr class="border-t ${r.jml>0?'':'text-zinc-500'}"><td class="p-2 mono">${escHtml(r.barcode)}</td><td class="p-2">${escHtml(r.nama)}</td><td class="p-2 text-center">${r.stok_awal}</td>${cols.map(c=>{const q=r.divisi_qty[c.key]||0;return`<td class="p-2 text-center ${q>0?'bg-amber-100 font-bold':''}">${q>0?q:'–'}</td>`;}).join('')}<td class="p-2 text-center font-bold">${r.jml}</td><td class="p-2 text-center font-bold ${r.stok_akhir<=0?'text-red-600':''}">${r.stok_akhir}</td></tr>`;});
  box.innerHTML=h+'</tbody></table>';
}

      tepat sebelum baris penanda  END LAPORAN BULANAN

const LAP_BATAS_RESTOK = 10;                 // stok akhir <= angka ini => status PERLU RESTOK
const LAP_FMT_ANGKA = '#,##0;[Red]\\-#,##0;\\–';
const LAP_NAVY = 'FF17365D', LAP_HEAD = 'FF1F4E78';
const LAP_LITE = {style:'thin',color:{argb:'FFD4D4D8'}};
const LAP_LINE = {top:LAP_LITE,left:LAP_LITE,bottom:LAP_LITE,right:LAP_LITE};

function lapDivName(k){k=String(k);return k.startsWith('X:')?k.slice(2):LAP_DIV[k].rekap;}
function lapFmt(n){return Number(n||0).toLocaleString('id-ID');}
function lapFill(a){return {type:'pattern',pattern:'solid',fgColor:{argb:a}};}
function lapSet(ws,addr,val,font,fill,al,fmt){
  const c=ws.getCell(addr);c.value=val;
  if(font)c.font=font;if(fill)c.fill=fill;if(al)c.alignment=al;if(fmt)c.numFmt=fmt;
  return c;
}
function lapTH(ws,row,col,texts){
  texts.forEach((t,i)=>{
    const c=ws.getCell(row,col+i);c.value=t;
    c.font={name:'Calibri',size:10,bold:true,color:{argb:'FFFFFFFF'}};
    c.fill=lapFill(LAP_HEAD);c.border=LAP_LINE;
    c.alignment={horizontal:'center',vertical:'middle',wrapText:true};
  });
}
function lapTD(ws,row,col,val,horizontal,fmt,bold){
  const c=ws.getCell(row,col);c.value=val;
  c.font={name:'Calibri',size:10,bold:!!bold,color:{argb:'FF202020'}};
  c.border=LAP_LINE;c.alignment={horizontal:horizontal||'left',vertical:'middle',wrapText:true};
  if(fmt)c.numFmt=fmt;return c;
}
function lapJudul(ws,lastCol,t1,t2,size){
  ws.mergeCells(1,1,1,lastCol);ws.mergeCells(2,1,2,lastCol);
  lapSet(ws,'A1',t1,{name:'Calibri',size:size||16,bold:true,color:{argb:LAP_NAVY}},null,{horizontal:'center',vertical:'middle'});
  lapSet(ws,'A2',t2,{name:'Calibri',size:10,color:{argb:'FF666666'}},null,{horizontal:'center',vertical:'middle'});
  ws.getRow(1).height=28;ws.getRow(2).height=18;
}
function lapPrint(ws,landscape,tinggi){
  ws.pageSetup={orientation:landscape?'landscape':'portrait',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:tinggi===undefined?0:tinggi,horizontalCentered:true,
    margins:{left:0.4,right:0.4,top:0.5,bottom:0.5,header:0.3,footer:0.3}};
}

/* Grafik batang horizontal -> PNG (ExcelJS tidak punya fitur chart, jadi grafik disisipkan sebagai gambar agar ikut tercetak) */
function lapBarPNG(labels,data,w,h,title){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const bg={id:'lapBg',beforeDraw(c){const x=c.ctx;x.save();x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);x.restore();}};
  const vl={id:'lapVal',afterDatasetsDraw(c){
    const x=c.ctx;x.save();x.font='bold 11px Arial';x.fillStyle='#202020';x.textBaseline='middle';x.textAlign='left';
    c.getDatasetMeta(0).data.forEach((b,i)=>{x.fillText(String(c.data.datasets[0].data[i]),b.x+5,b.y);});x.restore();}};
  const ch=new Chart(cv,{type:'bar',
    data:{labels,datasets:[{label:title||'',data,backgroundColor:'#1F4E78'}]},
    options:{indexAxis:'y',responsive:false,animation:false,devicePixelRatio:2,
      layout:{padding:{right:38,top:4,bottom:4}},
      plugins:{legend:{display:false},title:{display:!!title,text:title||'',font:{size:13,weight:'bold'}}},
      scales:{x:{beginAtZero:true,ticks:{precision:0}},y:{ticks:{font:{size:11}}}}},
    plugins:[bg,vl]});
  const url=cv.toDataURL('image/png');ch.destroy();
  return url.split(',')[1];
}
function lapAddChart(wb,ws,b64,col,row,w,h){
  const id=wb.addImage({base64:b64,extension:'png'});
  ws.addImage(id,{tl:{col:col,row:row},ext:{width:w,height:h}});
}

/* Ringkasan angka dari rekapRows (dipakai Dashboard, Pengeluaran Divisi, Top 10, Catatan) */
function lapRingkasan(rekapRows,colsAll){
  const sum=f=>rekapRows.reduce((s,r)=>s+f(r),0);
  const divTot=colsAll.map(c=>({key:c.key,nama:lapDivName(c.key),jml:sum(r=>r.divisi_qty[c.key]||0)}));
  const top=rekapRows.filter(r=>r.jml>0).slice()
    .sort((a,b)=>b.jml-a.jml||String(a.nama).localeCompare(String(b.nama))).slice(0,10);
  const maxDiv=divTot.slice().sort((a,b)=>b.jml-a.jml)[0];
  return{
    divTot,top,
    keluar:sum(r=>r.jml),awal:sum(r=>r.stok_awal),akhir:sum(r=>r.stok_akhir),
    jenis:rekapRows.length,jenisKeluar:rekapRows.filter(r=>r.jml>0).length,
    divTertinggi:(maxDiv&&maxDiv.jml>0)?maxDiv:null,
    nol:rekapRows.filter(r=>r.stok_akhir<=0),
    minus:rekapRows.filter(r=>r.stok_akhir<0),
    rendah:rekapRows.filter(r=>r.stok_akhir>=1&&r.stok_akhir<=5).length,
    restok:rekapRows.filter(r=>r.stok_akhir<=LAP_BATAS_RESTOK).length
  };
}

/* ---------- GENERATE LAPORAN ---------- */
async function generateLaporan(){
  if(typeof ExcelJS==='undefined'){toast('Library ExcelJS belum termuat. Cek koneksi internet lalu refresh.','error');return;}
  if(typeof Chart==='undefined'){toast('Library Chart.js belum termuat. Cek koneksi internet lalu refresh.','error');return;}
  const bulan=state.lapBulan,tahun=state.lapTahun,namaBulan=BULAN_NAMA[bulan-1];
  const {rows,cols,rekapRows}=buildLaporanData(bulan,tahun);
  if(rows.length===0){toast(`Tidak ada transaksi keluar untuk ${namaBulan} ${tahun}`,'error');return;}
  const thin={style:'thin'};const border={top:thin,left:thin,bottom:thin,right:thin};
  const lastDay=new Date(tahun,bulan,0).getDate();
  const tglAkhir=`${lastDay} ${namaBulan} ${tahun}`;
  const wb=new ExcelJS.Workbook();wb.creator='GoedangDA - Darul Arqam';wb.created=new Date();

  /* semua divisi selalu tampil (walau 0), ditambah divisi tak dikenal bila ada */
  const colsAll=[...LAP_ORDER_REKAP.map(k=>({key:k,title:LAP_DIV[k].full})),...cols.filter(c=>c.key.startsWith('X:'))];
  const S=lapRingkasan(rekapRows,colsAll);
  const ctx={S,colsAll,tglAkhir,namaBulan,tahun};

  /* 1) DASHBOARD */
  lapSheetDashboard(wb,ctx);

  /* 2) REKAP STOK (seluruh master barang, siap cetak + tanda tangan) */
  const ws=wb.addWorksheet('Rekap Stok',{views:[{state:'frozen',ySplit:4,zoomScale:90}]});
  const nDiv=colsAll.length;
  const total=8+nDiv;                          /* No, Barcode, Nama, Satuan, Stok Awal, divisi..., Total Keluar, Stok Akhir, Status */
  const cJml=6+nDiv,cAkhir=7+nDiv,cStat=8+nDiv;
  const hdrFill=lapFill('FF18181B'),qtyFill=lapFill('FFFEF3C7');
  ws.mergeCells(1,1,1,total);ws.mergeCells(2,1,2,total);
  const t1=ws.getCell(1,1);t1.value='LAPORAN REKAPITULASI PERSEDIAAN BARANG GUDANG';t1.font={name:'Arial',size:14,bold:true};t1.alignment={horizontal:'center'};ws.getRow(1).height=18;
  const t2=ws.getCell(2,1);t2.value=`Periode : ${tglAkhir}`;t2.font={name:'Calibri',size:12,bold:true};t2.alignment={horizontal:'center'};ws.getRow(2).height=15.75;
  const heads=['No','Barcode','Nama Barang','Satuan','Stok Awal',...colsAll.map(c=>lapDivName(c.key)),'Total Keluar','Stok Akhir','Status'];
  heads.forEach((txt,i)=>{const c=ws.getCell(4,i+1);c.value=txt;c.font={name:'Calibri',size:10,bold:true,color:{argb:'FFFFFFFF'}};c.fill=hdrFill;c.border=LAP_LINE;c.alignment={horizontal:(i===1||i===2)?'left':'center',vertical:'middle',wrapText:true};});
  ws.getRow(4).height=32;
  rekapRows.forEach((r,i)=>{
    const row=ws.getRow(5+i);row.height=20;
    const restok=r.stok_akhir<=LAP_BATAS_RESTOK;
    const vals=[i+1,r.barcode,r.nama,r.satuan||'Pcs',r.stok_awal,...colsAll.map(c=>r.divisi_qty[c.key]||0),r.jml,r.stok_akhir,restok?'PERLU RESTOK':'AMAN'];
    vals.forEach((v,j)=>{
      const c=row.getCell(j+1);c.value=v;c.border=LAP_LINE;
      const isDiv=j>=5&&j<5+nDiv;const hit=isDiv&&v>0;
      c.font=j===1?{name:'Courier New',size:9,bold:true}:{name:'Calibri',size:10,bold:(hit||j>=5+nDiv)};
      if(hit)c.fill=qtyFill;
      if(j>=4&&j<=cAkhir-1)c.numFmt=LAP_FMT_ANGKA;
      c.alignment={horizontal:(j===1||j===2)?'left':'center',vertical:'middle',wrapText:j===2};
      if(j===cStat-1){
        c.font={name:'Calibri',size:10,bold:true,color:{argb:restok?'FF9C0006':'FF006100'}};
        c.fill=lapFill(restok?'FFFFC7CE':'FFC6EFCE');
      }
    });
  });
  const lastRow=4+rekapRows.length;
  [6,20,36,10,11].forEach((w,i)=>{ws.getColumn(i+1).width=w;});
  for(let i=0;i<nDiv;i++)ws.getColumn(6+i).width=Math.max(11,Math.min(16,lapDivName(colsAll[i].key).length+3));
  ws.getColumn(cJml).width=12;ws.getColumn(cAkhir).width=11;ws.getColumn(cStat).width=16;
  /* blok tanda tangan */
  const sg=lastRow+2;
  const rg=[[1,2],[Math.max(3,Math.floor(total/2)-1),Math.max(3,Math.floor(total/2)-1)+2],[Math.max(total-3,7),total]];
  const okMerge=rg.every((x,i)=>x[0]<=total&&x[1]<=total&&(i===0||x[0]>rg[i-1][1]));
  const blok=[{c1:rg[0][0],c2:rg[0][1],d:LAP_TTD.kiri},{c1:rg[1][0],c2:rg[1][1],d:LAP_TTD.tengah},{c1:rg[2][0],c2:rg[2][1],d:LAP_TTD.kanan}];
  if(!okMerge){blok[0].c1=blok[0].c2=1;blok[1].c1=blok[1].c2=Math.max(2,Math.ceil(total/2));blok[2].c1=blok[2].c2=total;}
  const put=(rr,b,txt,font)=>{if(b.c2>b.c1)ws.mergeCells(rr,b.c1,rr,b.c2);const c=ws.getCell(rr,b.c1);c.value=txt;c.font=font;c.alignment={horizontal:'center'};};
  put(sg,blok[2],`${LAP_TTD.tempat}, ${tglAkhir}`,{name:'Calibri',size:11});

    put(sg+6,b,b.d.nama,{name:'Calibri',size:11,bold:true});put(sg+7,b,b.d.nipp,{name:'Calibri',size:11});
  });
  ws.pageSetup={orientation:'landscape',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0,horizontalCentered:true,margins:{left:0.25,right:0.25,top:0.31,bottom:0.29,header:0.3,footer:0.3}};
  ws.pageSetup.printTitlesRow='4:4';

  /* 3-5) PENGELUARAN DIVISI, TOP 10, CATATAN */
  lapSheetPengeluaran(wb,ctx);
  lapSheetTop10(wb,ctx);
  lapSheetCatatan(wb,ctx);

  /* 6) SHEET ANTAR DIVISI (tetap seperti sebelumnya) */
  const used=new Set(['Dashboard','Rekap Stok','Pengeluaran Divisi','Top 10 Barang','Catatan']);
  const uniq=nm=>{nm=nm.replace(/[\\\/\?\*\[\]:]/g,'-').substring(0,31);let k=2,base=nm;while(used.has(nm)){nm=base.substring(0,28)+'-'+k++;}used.add(nm);return nm;};
  const sheets=[...LAP_ORDER_SHEET.map(k=>({key:k,name:LAP_DIV[k].sheet,full:LAP_DIV[k].full,label:LAP_DIV[k].label})),
                ...cols.filter(c=>c.key.startsWith('X:')).map(c=>({key:c.key,name:c.title,full:c.title,label:c.title}))];
  const satuanOf={};state.master.forEach(m=>{satuanOf[String(m.Barcode)]=m.Satuan;});
  for(const s of sheets){
    const list=rows.filter(r=>r.dk===s.key).sort((a,b)=>new Date(a.tanggal)-new Date(b.tanggal));
    const sh=wb.addWorksheet(uniq(s.name));
    sh.mergeCells('A1:H1');
    const h1=sh.getCell('A1');h1.value=`Detail Transaksi Barang Keluar dari GUDANG PPDA\n${s.full}\nPeriode Bulan ${namaBulan} ${tahun}`;
    h1.font={name:'Arial',size:10,bold:true};h1.alignment={horizontal:'center',vertical:'middle',wrapText:true};sh.getRow(1).height=48;
    [['No','center'],['Struk','left'],['Tanggal','center'],['Barang','left'],['Qty','center'],['Satuan','center'],['Divisi','left'],['Pengambil','left']].forEach(([txt,al],i)=>{
      const c=sh.getCell(2,i+1);c.value=txt;c.font={name:'Calibri',size:10,bold:true,color:{argb:'FFFFFFFF'}};c.fill=hdrFill;c.border=LAP_LINE;c.alignment={horizontal:al,vertical:'middle',wrapText:true};
    });
    sh.getRow(2).height=20;
    list.forEach((r,i)=>{
      const vals=[i+1,r.no_struk,lapXlDate(r.tanggal),r.nama_barang,r.jumlah,satuanOf[r.barcode]||'Pcs',s.label,r.pengambil];
      const al=['center','left','center','left','center','center','left','left'];
      vals.forEach((v,j)=>{const c=sh.getCell(3+i,j+1);c.value=v;c.font={name:'Calibri',size:9};c.border=border;c.alignment={horizontal:al[j],vertical:'middle',wrapText:j!==0};if(j===2)c.numFmt='[$-13809]dd/mm/yy;@';});
    });
    [5.43,19.86,10.5,24,7.7,8.5,10.86,18.86].forEach((w,i)=>{sh.getColumn(i+1).width=w;});
    sh.pageSetup={orientation:'portrait',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:0.4,right:0.4,top:0.5,bottom:0.5,header:0.3,footer:0.3}};
    sh.pageSetup.printTitlesRow='2:2';
  }
  const buf=await wb.xlsx.writeBuffer();
  const url=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  const a=document.createElement('a');a.href=url;a.download=`Laporan_Bulanan_${namaBulan}_${tahun}.xlsx`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(`Laporan ${namaBulan} ${tahun} terdownload: ${rekapRows.length} barang master (${S.jenisKeluar} keluar), ${sheets.length} sheet divisi`,'success');
}

async function simpanEditBarang(){
  const el=document.getElementById('editNamaInput');if(!el)return;
  if(!canEditBarang()){toast('Akses ditolak','error');return;}
  const barcode=el.dataset.b;const nama=el.value.trim().replace(/\s+/g,' ');
  if(!nama){toast('Nama barang tidak boleh kosong','error');return;}
  const m=state.master.find(x=>String(x.Barcode)===String(barcode));
  if(!m){toast('Barang tidak ditemukan','error');return;}
  const adm=isAdmin();
  let jumlah=Number(m.Stok_Saat_Ini||0),harga=Number(m.Harga_Satuan||0);
  if(adm){
    const jv=document.getElementById('editJumlahInput').value,hv=document.getElementById('editHargaInput').value;
    jumlah=Number(jv);harga=Number(hv);
    if(jv===''||!Number.isFinite(jumlah)||jumlah<0||!Number.isInteger(jumlah)){toast('Jumlah harus bilangan bulat ≥ 0','error');return;}
    if(hv===''||!Number.isFinite(harga)||harga<0){toast('Harga harus angka ≥ 0','error');return;}
  }
  const namaBerubah=nama!==m.Nama_Barang,jumlahBerubah=jumlah!==Number(m.Stok_Saat_Ini||0),hargaBerubah=harga!==Number(m.Harga_Satuan||0);
  if(!namaBerubah&&!jumlahBerubah&&!hargaBerubah){closeModal();return;}
  if(namaBerubah){
    const dup=state.master.find(x=>String(x.Barcode)!==String(barcode)&&String(x.Nama_Barang||'').trim().toLowerCase()===nama.toLowerCase());
    if(dup&&!confirm(`Nama "${nama}" sudah dipakai barang lain (${dup.Barcode}). Tetap simpan?`))return;
  }
  if(jumlahBerubah&&!confirm(`Ubah stok "${nama}" dari ${m.Stok_Saat_Ini} menjadi ${jumlah}?`))return;
  m.Nama_Barang=nama;
  if(adm){
    m.Harga_Satuan=harga;
    if(jumlahBerubah){
      m.Stok_Saat_Ini=jumlah;
      m.Penyesuaian=jumlah-(Number(m.Total_Masuk||0)-Number(m.Total_Keluar||0));
    }
  }
  const syncCart=c=>{if(String(c.Barcode)!==String(barcode))return;c.Nama_Barang=nama;if(adm)c.Harga_Satuan=harga;};
  state.cartMasuk.forEach(syncCart);
  state.cartKeluar.forEach(i=>{syncCart(i);if(adm&&i.jumlah>m.Stok_Saat_Ini)i.jumlah=Math.max(1,m.Stok_Saat_Ini);});
  state.cartKeluar=state.cartKeluar.filter(i=>!(String(i.Barcode)===String(barcode)&&m.Stok_Saat_Ini<=0));
  save();closeModal();render();
  if(state.supabaseClient){
    try{
      const upd={nama_barang:nama};
      if(adm){upd.harga_satuan=m.Harga_Satuan;upd.stok_saat_ini=m.Stok_Saat_Ini;upd.penyesuaian=m.Penyesuaian;}
      const ok=await sendOrQueue({table:'master_barang',op:'update',values:upd,matchCol:'barcode',matchVal:barcode});
      toast(ok?'Master barang diperbarui':'Tersimpan lokal, akan dikirim saat online',ok?'success':'info');
    }catch(e){toast('Tersimpan lokal, gagal ke Supabase','error');}
  }else toast('Master barang diperbarui','success');
}

/* ===== OFFLINE SUPPORT: antrean kirim + status jaringan ===== */
const QKEY='goedangda_pending_q_v1';
let _flushing=false;
function getQ(){try{return JSON.parse(localStorage.getItem(QKEY)||'[]');}catch(e){return[];}}
function setQ(q){localStorage.setItem(QKEY,JSON.stringify(q));updateNetBadge();}
function netBadgeCls(){
  if(!state.supabaseMode)return'bg-amber-50 text-amber-700';
  if(!navigator.onLine)return'bg-red-50 text-red-700';
  if(getQ().length)return'bg-amber-50 text-amber-700';
  return'bg-emerald-50 text-emerald-700';
}
function netBadgeTxt(){
  const n=getQ().length;
  if(!state.supabaseMode)return'● MODE LOKAL';
  if(!navigator.onLine)return'● OFFLINE'+(n?' • '+n+' menunggu kirim':'');
  if(n)return'● ONLINE • '+n+' menunggu kirim';
  return'● SUPABASE CONNECTED';
}
function updateNetBadge(){const el=document.getElementById('netBadge');if(!el)return;el.className='mb-4 p-2 rounded-lg text-xs '+netBadgeCls();el.textContent=netBadgeTxt();}
async function runJob(j){
  const t=state.supabaseClient.from(j.table);
  if(j.op==='update')return await t.update(j.values).eq(j.matchCol,j.matchVal);
  return await t.upsert(j.rows,{onConflict:j.conflict});
}
// true = terkirim, false = masuk antrean (akan dikirim otomatis)
async function sendOrQueue(job){
  if(navigator.onLine&&getQ().length===0){
    try{const{error}=await runJob(job);if(!error)return true;console.error(error);}catch(e){console.error(e);}
  }
  const q=getQ();q.push(job);setQ(q);
  if(!navigator.onLine)toast('Offline: data disimpan di perangkat, dikirim otomatis saat online','info');
  else flushQueue();
  return false;
}
async function flushQueue(){
  if(!state.supabaseClient||!navigator.onLine)return getQ().length===0;
  if(_flushing)return false;
  _flushing=true;
  try{
    let q=getQ();
    while(q.length){
      let res;
      try{res=await runJob(q[0]);}catch(e){return false;}
      if(res.error){toast('Gagal kirim data tertunda: '+res.error.message,'error');console.error(res.error);return false;}
      q.shift();setQ(q);
    }
    return true;
  }finally{_flushing=false;updateNetBadge();}
}
window.addEventListener('online',()=>{
  updateNetBadge();
  if(!state.supabaseMode)return;
  toast('Kembali online, mengirim data tertunda...','info');
  setTimeout(async()=>{if(await flushQueue())syncFromSupabase();},1500);
});
window.addEventListener('offline',()=>{updateNetBadge();toast('Anda offline. Aplikasi tetap bisa dipakai.','info');});
setInterval(()=>{if(state.supabaseMode&&navigator.onLine&&getQ().length)flushQueue();},60000);
